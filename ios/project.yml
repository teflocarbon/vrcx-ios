# XcodeGen spec for Portal: `cd ios && xcodegen generate` writes
# Portal.xcodeproj (never committed) from this file.
name: Portal
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.2"
    # CI sets both from the IPA workflow's run number and the commit built
    CURRENT_PROJECT_VERSION: "1"
    PORTAL_COMMIT: local
targets:
  Portal:
    type: application
    platform: iOS
    sources:
      - Portal
    dependencies:
      # Adds senders' pictures to push notifications
      - target: PortalNotifications
    # Push from the relay, and invites that can break through Focus. CI
    # ad-hoc signs with these, so the signer knows to provision them.
    entitlements:
      path: Portal/Portal.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        # A placeholder: the signer re-provisions it with your own
        PRODUCT_BUNDLE_IDENTIFIER: com.example.portal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Portal/Info.plist
      properties:
        CFBundleDisplayName: Portal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PortalCommit: $(PORTAL_COMMIT)
        UILaunchScreen: {}
        # Background checks for invites when signed in to VRChat directly,
        # with no relay to push (Platform/BackgroundCheck.swift). Re-signing
        # remaps the bundle ID here as everywhere else in Info.plist.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  # A notification service extension: downloads the sender's picture from
  # the relay's image route and attaches it to the push
  PortalNotifications:
    type: app-extension
    platform: iOS
    sources:
      - PortalNotifications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.portal.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: PortalNotifications/Info.plist
      properties:
        CFBundleDisplayName: Portal Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
