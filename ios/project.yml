# XcodeGen spec for Portal: `cd ios && xcodegen generate` writes
# Portal.xcodeproj (never committed) from this file.
name: Portal
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # CI sets both from the IPA workflow's run number and the commit built
    CURRENT_PROJECT_VERSION: "1"
    PORTAL_COMMIT: local
targets:
  Portal:
    type: application
    platform: iOS
    sources:
      - Portal
    settings:
      base:
        # A placeholder: the signer re-provisions it with your own
        PRODUCT_BUNDLE_IDENTIFIER: com.example.portal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Portal/Info.plist
      properties:
        CFBundleDisplayName: Portal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PortalCommit: $(PORTAL_COMMIT)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
